# Vérifications à chaque push et pull request : lint, format, types, tests, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build ne contacte pas Supabase.
          VITE_SUPABASE_URL: https://exemple.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: cle-factice-pour-la-ci-uniquement

  e2e:
    # Parcours connexion, recherche, notation et accessibilité (axe), thèmes clair et sombre,
    # contre un faux serveur Supabase simulé dans les tests : aucun secret nécessaire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
